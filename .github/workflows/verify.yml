name: verify

# Two triggers, for two different failures.
#
# On push: did a change to cs break something.
# On schedule: did an ENGINE change underneath us. Search engines update
# independently of this repo, and a regression in one is invisible from the
# outside -- the facade routes around it and still returns results, just worse
# ones. The weekly run is the only thing that notices.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
    # NOTE: GitHub disables scheduled workflows after 60 days with no repo
    # activity, and says so only by email. A schedule that has stopped running
    # looks exactly like a schedule that keeps passing, so if this repo goes
    # quiet, check the Actions tab rather than trusting the last green run.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # tokensave checks for a newer release on init/sync/status; CI tests a pinned one.
      TOKENSAVE_UPDATE_CHECK: "off"

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate below diffs against the base of the change, so the history
          # has to be there. The default shallow clone has one commit and no
          # merge base, and the check would report "nothing to compare".
          fetch-depth: 0

      # Before the engines are installed, because it needs none of them and a
      # version that cannot reach its users is a shipping failure whatever the
      # suites say. Ten commits and four new verbs once went out under an
      # unchanged version string: the marketplace cache held the old artifact,
      # `claude plugin update` correctly said "already at the latest version",
      # and comparing version strings -- the usual way to debug that -- said
      # the two matched.
      - name: Check the plugin version moved with the shipped files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="" ;; esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            ./scripts/check-version-bump "$(git merge-base HEAD "$base")"
          else
            ./scripts/check-version-bump
          fi

      # Best-effort by design. Every engine here is OPTIONAL -- cs routes around
      # whatever is missing, verify-engines reports it as MISSING rather than
      # FAIL, and verify-search skips the checks that need it. So a registry
      # hiccup on the unattended weekly run should degrade to "that engine is
      # absent", which the suites already handle correctly, instead of failing
      # the job as though an engine had regressed. Those two outcomes mean
      # opposite things and the schedule exists to tell them apart.
      - name: Install engines
        run: |
          try() {
            echo "::group::install $*"
            if "$@"; then echo "::endgroup::"
            else echo "::endgroup::"; echo "::warning::install failed (engine will be reported absent): $*"; fi
          }
          try sudo apt-get update -qq
          try sudo apt-get install -y -qq ripgrep universal-ctags
          try npm install -g @ast-grep/cli
          pipx install semgrep \
            || pip install --quiet semgrep \
            || echo "::warning::semgrep unavailable (engine will be reported absent)"

      # tokensave, at exactly the version this release was tested with (#105).
      # Without it a green run covered none of the graph paths: cs callers /
      # callees / impact / fields, the minimum-version refusal, the C# graph
      # caveats, and the tokensave probes. The version is read from the
      # baseline, so moving the baseline moves CI with it, and the binary is
      # checked against the release's SHA256SUMS before it runs. Best-effort
      # like the rest: a failed download leaves tokensave absent, which the
      # suites report as skipped -- and the step below says so.
      - name: Install tokensave (the tested version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(awk -F'\t' '$1 == "tokensave" { print $2; exit }' fixtures/verified-versions.tsv)
          asset="tokensave-v${ver}-x86_64-linux.tar.gz"
          dir=$(mktemp -d)
          if [ -n "$ver" ] && [ "$ver" != "-" ] \
             && gh release download "v$ver" -R aovestdipaperino/tokensave -D "$dir" -p "$asset" -p SHA256SUMS \
             && (cd "$dir" && grep "  $asset\$" SHA256SUMS | sha256sum -c -) \
             && tar -xzf "$dir/$asset" -C "$dir" tokensave; then
            mkdir -p "$HOME/.local/bin" && install -m 755 "$dir/tokensave" "$HOME/.local/bin/tokensave"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            # The runner's own config: no counter uploads from CI.
            "$HOME/.local/bin/tokensave" disable-upload-counter >/dev/null 2>&1 || true
            "$HOME/.local/bin/tokensave" --version
          else
            echo "::warning::tokensave ${ver:-?} could not be installed (the graph checks will be reported as skipped)"
          fi

      # A run where everything failed to install would still PASS both suites,
      # because both correctly skip what is absent -- and a green run that
      # exercised nothing is precisely the hazard this project is organised
      # against. So the vacuous case is made loud.
      - name: Refuse a vacuous run
        run: |
          missing=0
          for e in rg ctags ast-grep semgrep; do
            if command -v "$e" >/dev/null 2>&1; then
              echo "ok       $e"
            else
              echo "MISSING  $e"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ge 4 ]; then
            echo "::error::no search engine installed — this run would prove nothing"
            exit 1
          fi
          echo "$missing of 4 optional engines absent; the suites will skip what they cannot exercise."
          # Not counted above (it is not a search engine), but named: without it
          # every graph check is a skip, and a skip is not a pass.
          if command -v tokensave >/dev/null 2>&1; then echo "ok       tokensave $(tokensave --version | awk '{print $2}')"
          else echo "::warning::tokensave absent — the graph checks will be skipped"; fi

      - name: Record engine versions
        run: ./scripts/bootstrap --check || true

      # Each engine is probed directly on the capability the routing depends on
      # it for. Serena is absent here (it needs a toolchain per language), which
      # the probe reports rather than failing on.
      - name: Verify engines
        run: ./scripts/verify-engines

      # End-to-end: every scored query plus the fleet/ticket layering.
      - name: Verify search
        run: ./scripts/verify-search

      - name: Show version drift
        if: always()
        run: |
          echo "Baseline recorded in fixtures/verified-versions.tsv:"
          cat fixtures/verified-versions.tsv
          echo
          echo "A version change is not a failure by itself -- it is a prompt to"
          echo "read the probe results above and, if they are still correct, to"
          echo "re-run ./scripts/verify-engines --update and commit the baseline."
